[package]
name = "hostmylauncher"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Async Rust client (REST + WebSocket) for the HostMyLauncher launcher API."
repository = "https://github.com/HostMyLauncher/hostmylauncher-rs"
keywords = ["hostmylauncher", "minecraft", "launcher", "websocket", "client"]
categories = ["api-bindings", "web-programming"]

[features]
default = ["download"]
# File download with SHA-1/SHA-512 + size verification.
download = ["dep:sha1", "dep:sha2", "dep:hex", "dep:tempfile", "dep:zip", "tokio/fs", "tokio/io-util", "reqwest/stream"]
# High-level InstanceWatcher that keeps a live, reconciled instance list.
watch = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

# download feature
sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
tempfile = { version = "3", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[[example]]
name = "launcher"
